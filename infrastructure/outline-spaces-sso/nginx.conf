events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    location = /spaces-shell.css {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=300";
    }

    location = /spaces-shell.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      proxy_pass http://outline:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      sub_filter_once on;
      sub_filter '</body>' '<iframe id="spaces-tenant-frame" src="/spaces-panel" title="Spaces" aria-label="Spaces"></iframe><link rel="stylesheet" href="/spaces-shell.css"><script defer src="/spaces-shell.js"></script></body>';
    }
  }
}
