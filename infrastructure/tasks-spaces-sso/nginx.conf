# SPC-0017: injects the Spaces tenant panel into Paca pages and proxies
# everything else (API, WebSocket, storage) to the Paca gateway unchanged.
events {}

http {
  include /etc/nginx/mime.types;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    client_max_body_size 200m;

    location = /spaces-shell.css {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=300";
    }

    location = /spaces-shell.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      proxy_pass http://gateway:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      sub_filter_once on;
      sub_filter '</body>' '<iframe id="spaces-tenant-frame" src="/spaces-panel" title="Spaces" aria-label="Spaces"></iframe><link rel="stylesheet" href="/spaces-shell.css?v=spc0017-2"><script defer src="/spaces-shell.js?v=spc0017-2"></script></body>';
    }
  }
}
