# SPC-0020: preview of branch `stage` (staging Supabase). Static SPA only:
# production backends (/api/billing etc.) are not proxied here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://stage-supabase.spaces.community wss://stage-supabase.spaces.community; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://stage-supabase.spaces.community" always;

    location = /preview-status.json {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
