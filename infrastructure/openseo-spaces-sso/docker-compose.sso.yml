services:
  open-seo:
    networks:
      default:
        aliases:
          - openseo.spaces.community
  spaces-sso:
    image: node:20-alpine
    container_name: openseo-spaces-sso
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
    command: ["node", "/sso/server.js"]
    volumes:
      - ./spaces-sso:/sso:ro
      - /opt/spaces/repo/infrastructure/shared:/spaces-shared:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openseo-spaces-sso.rule=Host(`openseo.spaces.community`) && (PathPrefix(`/spaces-sso`) || Path(`/spaces-panel`))"
      - "traefik.http.routers.openseo-spaces-sso.entrypoints=websecure"
      - "traefik.http.routers.openseo-spaces-sso.priority=10000"
      - "traefik.http.routers.openseo-spaces-sso.tls.certresolver=letsencrypt"
      - "traefik.http.services.openseo-spaces-sso.loadbalancer.server.port=3000"
