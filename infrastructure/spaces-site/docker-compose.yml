services:
  site:
    image: nginx:alpine
    container_name: spaces-site
    restart: unless-stopped
    volumes:
      - /opt/spaces/site:/usr/share/nginx/html:ro
      - /opt/spaces/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spaces.rule=Host(`spaces.community`)"
      - "traefik.http.routers.spaces.entrypoints=websecure"
      - "traefik.http.routers.spaces.tls.certresolver=letsencrypt"
      - "traefik.http.routers.superadminko.rule=Host(`superadminko.spaces.community`)"
      - "traefik.http.routers.superadminko.entrypoints=websecure"
      - "traefik.http.routers.superadminko.tls.certresolver=letsencrypt"
      - "traefik.http.routers.superadminko.service=spaces"
      - "traefik.http.services.spaces.loadbalancer.server.port=80"
  provisioner:
    image: node:20-alpine
    container_name: spaces-provisioner
    restart: unless-stopped
    env_file:
      - /opt/spaces/provisioner.env
    environment:
      - POLL_INTERVAL_MS=10000
    command: ["node", "/app/server.js"]
    volumes:
      - /opt/spaces/repo/infrastructure/provisioner/server.js:/app/server.js:ro
  billing:
    image: node:20-alpine
    container_name: spaces-billing
    restart: unless-stopped
    env_file:
      - /opt/spaces/billing.env
    command: ["node", "/app/server.js"]
    volumes:
      - /opt/spaces/repo/infrastructure/billing/server.js:/app/server.js:ro
