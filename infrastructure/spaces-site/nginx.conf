server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://fnrzqmecumyagcajivsu.supabase.co wss://fnrzqmecumyagcajivsu.supabase.co; frame-src https://spaces.community; frame-ancestors 'self' https://superadminko.spaces.community; base-uri 'self'; form-action 'self' https://accounts.google.com https://fnrzqmecumyagcajivsu.supabase.co" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/billing/ {
        proxy_pass http://billing:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
